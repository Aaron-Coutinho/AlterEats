<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Altereats</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css"> <!-- Assuming a similar CSS file exists -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Firebase Compat SDK -->
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <div class="logo-circle"></div>
            Altereats
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="register.html">Sign Up</a>
        </div>
    </nav>

    <div class="login-container">
        <h1 class="animate__animated animate__fadeIn">Login to Your Account</h1>
        <div id="notification" class="notification"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
                <div class="error"></div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                <div class="error"></div>
            </div>
            <button type="submit" class="submit-btn animate__animated animate__pulse animate__infinite">Login</button>
        </form>
        <p class="signup-link">Don't have an account? <a href="register.html">Sign Up</a></p>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
